{% extends "Cinturones/base.html" %}

{% block extra_css %}
<style>
  .kblix-hero {
    position: relative; isolation: isolate;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(2.5rem, 8vh, 5rem) 0 2rem;
    text-align: center;
  }
  .kblix-title { font-size: 36px; font-weight: 800; letter-spacing: -.02em; color: var(--text); margin: 0 0 .35rem; }
  .kblix-sub { color: var(--text-2); font-size: 15px; margin-bottom: 1.75rem; }
  .kblix-card {
    padding: 1.5rem;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    text-align: left;
  }
  .kblix-card .campo { font-size: 16px; letter-spacing: .08em; text-align: center; padding: .65rem 1rem; }
  .kblix-card .btn { padding: .6rem; font-size: 15px; }
  .kblix-divider {
    display: flex; align-items: center; gap: .8rem;
    color: var(--hai); font-size: 13px;
  }
  .kblix-divider::before, .kblix-divider::after { content: ''; flex: 1; height: 1px; background: var(--sumi-linea); }
</style>
{% endblock %}

{% block content %}
<div class="kblix-hero">
  <h1 class="kblix-title aparece">Kblix</h1>
  <p class="kblix-sub aparece">¿Quién jugó con quién?</p>

  <div class="carta kblix-card aparece">
    <a href="{% url 'kblix:crear_sala' %}" class="btn btn-primary w-100">Crear nueva sala</a>

    <div class="kblix-divider">o únete con un código</div>

    <form id="join-form" style="display:flex; flex-direction:column; gap:0.75rem;">
      <input type="text" id="room-input" class="campo" placeholder="Código (ej: AB12CD)"
             maxlength="6" style="text-transform:uppercase;" autocomplete="off" aria-label="Código de sala">
      <button type="submit" class="btn btn-outline-secondary w-100">Unirse</button>
    </form>
  </div>
</div>

<script>
  document.getElementById('join-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const code = document.getElementById('room-input').value.trim().toUpperCase();
    if (code.length === 6) {
      window.location.href = `/kblix/sala/${code}/`;
    }
  });
</script>
{% endblock %}
