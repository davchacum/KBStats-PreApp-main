{% extends "Cinturones/base.html" %}

{% block extra_css %}
<style>
  .sala-wrap {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    padding-bottom: 3rem;
  }
  .sala-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sala-title { display: flex; align-items: center; gap: .75rem; color: var(--text); font-size: 24px; font-weight: 700; }
  .sala-title .sello { width: 42px; font-size: 22px; box-shadow: none; }
  .room-badge {
    border: 1px solid var(--sumi-linea);
    border-radius: var(--radio-fino);
    padding: 0.35rem 0.9rem;
    font-size: 14px;
    color: var(--hai);
  }
  .room-badge b { color: var(--oro); letter-spacing: .1em; }

  #status-box, #cadena-box, #fin-box {
    background: var(--sumi-alzado);
    border: 1px solid var(--sumi-linea);
    border-radius: var(--radio);
  }
  #status-box {
    padding: 2rem;
    text-align: center;
    font-size: 17px;
    color: var(--hai);
  }
  #share-box { display: none; text-align: center; color: var(--hai); font-size: 14px; }
  #share-link {
    display: inline-block;
    margin-left: .4rem;
    background: var(--sumi-hondo);
    border: 1px dashed var(--oro-viejo);
    padding: 0.3rem 0.8rem;
    border-radius: var(--radio-fino);
    font-family: ui-monospace, Consolas, monospace;
    letter-spacing: .12em;
    color: var(--oro);
    cursor: pointer;
    user-select: all;
  }

  /* El jugador a conectar, en una carta con el filo de oro */
  #jugador-actual-box {
    display: none;
    background: var(--surface);
    border: 1px solid var(--oro-viejo);
    border-radius: var(--radio-carta);
    box-shadow: none;
    padding: 1.75rem 1.5rem;
    text-align: center;
  }
  #jugador-actual-box .label { color: var(--hai); font-size: 12px; font-weight: 700;  margin-bottom: 0.5rem; }
  #jugador-actual { font-size: clamp(26px, 4.5vw, 36px); font-weight: 700; color: var(--text); line-height: 1.15; }

  #timer-box { display: none; text-align: center; }
  #timer-bar-container {
    background: var(--sumi-linea);
    height: 6px;
    overflow: hidden;
    margin-bottom: 0.4rem;
  }
  #timer-bar { height: 100%; background: var(--bien); transition: width 1s linear, background 1s; }
  #timer-text { color: var(--hai); font-size: 14px; font-variant-numeric: tabular-nums; }

  #cadena-box {
    display: none;
    padding: 1.25rem;
  }
  #cadena-box h3 { color: var(--hai); font-family: var(--gothic); font-size: 12px; font-weight: 700; margin-bottom: 1rem;  }
  #cadena { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .cadena-item {
    background: var(--sumi-hondo);
    border: 1px solid var(--sumi-linea);
    border-radius: var(--radio-fino);
    padding: 0.35rem 0.75rem;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .cadena-item::after { content: '→'; color: var(--hai-oscuro); }
  .cadena-item:last-child::after { content: ''; }
  .cadena-item.activo { border-color: var(--oro-viejo); color: var(--oro); font-weight: 700; }

  #input-box { display: none; flex-direction: column; gap: 0.75rem; }
  #turno-label {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    padding: 0.55rem;
    border-radius: var(--radio-fino);
    letter-spacing: .04em;
  }
  .turno-yo { background: var(--shu); color: var(--washi); }
  .turno-rival { background: var(--sumi-alzado); color: var(--hai); border: 1px solid var(--sumi-linea); }
  .input-row { display: flex; gap: 0.75rem; }
  #nombre-input {
    flex: 1;
    min-width: 0;
    background: var(--sumi-hondo);
    border: 1px solid var(--sumi-linea);
    border-radius: var(--radio-fino);
    padding: 0.75rem 1rem;
    color: var(--washi);
    font-size: 16px;
  }
  #nombre-input:focus { outline: none; border-color: var(--oro-viejo); box-shadow: 0 0 0 3px rgba(235, 210, 138, .12); }
  #nombre-input:disabled { opacity: 0.4; cursor: not-allowed; }
  #enviar-btn, #rematch-btn {
    position: relative;
    isolation: isolate;
    padding: 0.75rem 1.6rem;
    background: transparent;
    color: var(--washi);
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  #enviar-btn::before, #rematch-btn::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: var(--shu); border-radius: var(--radio-fino); transform: skewX(-12deg);
    transition: background-color .2s, box-shadow .2s;
  }
  #enviar-btn:hover:not(:disabled)::before, #rematch-btn:hover:not(:disabled)::before { background: var(--shu-claro); box-shadow: inset 0 -2px 0 var(--oro); }
  #enviar-btn:disabled, #rematch-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #error-msg { color: var(--shu-claro); font-size: 14px; text-align: center; min-height: 1.2rem; }

  #fin-box {
    display: none;
    padding: 2.5rem;
    text-align: center;
  }
  #fin-box h2 { font-size: clamp(32px, 5vw, 44px); margin-bottom: 0.5rem; }
  #fin-box p { color: var(--hai); margin-bottom: 1.25rem; }
  #opciones-box {
    margin: 1rem 0 1.75rem;
    display: none;
    flex-direction: column;
    gap: 0.5rem;
    align-items: center;
  }
  .opciones-label { font-size: 12px; font-weight: 700; color: var(--hai);  margin-bottom: 0.25rem; }
  .opciones-lista { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
  .opcion {
    border: 1px solid var(--oro-viejo);
    color: var(--oro);
    border-radius: var(--radio-fino);
    padding: 0.45rem 1rem;
    font-size: 15px;
    font-weight: 700;
  }
</style>
{% endblock %}

{% block content %}
<div class="sala-wrap">
  <div class="sala-header">
    <span class="sala-title">Kblix</span>
    <span class="room-badge">Sala <b>{{ room_id }}</b></span>
  </div>

  <div id="status-box">Conectando...</div>

  <div id="share-box">
    Comparte el código con tu rival:
    <span id="share-link" title="Haz clic para copiar">{{ room_id }}</span>
  </div>

  <div id="jugador-actual-box">
    <div class="label">Hay que conectar con</div>
    <div id="jugador-actual">—</div>
  </div>

  <div id="timer-box">
    <div id="timer-bar-container">
      <div id="timer-bar" style="width:100%"></div>
    </div>
    <div id="timer-text">15s</div>
  </div>

  <div id="cadena-box">
    <h3>Cadena</h3>
    <div id="cadena"></div>
  </div>

  <div id="input-box">
    <div id="turno-label" class="turno-rival">Turno del rival...</div>
    <div class="input-row">
      <input type="text" id="nombre-input" placeholder="Nombre del jugador..." autocomplete="off" disabled>
      <button id="enviar-btn" disabled>Enviar</button>
    </div>
    <div id="error-msg"></div>
  </div>

  <div id="fin-box">
    <h2 id="fin-titulo"></h2>
    <p id="fin-razon"></p>
    <div id="opciones-box">
      <div class="opciones-label">Podías haber dicho...</div>
      <div class="opciones-lista" id="opciones-lista"></div>
    </div>
    <button id="rematch-btn" onclick="pedirRevancha()">Jugar de nuevo</button>
  </div>
</div>

<script>
  const ROOM_ID = '{{ room_id }}';
  const wsProto = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${wsProto}://${window.location.host}/ws/kblix/${ROOM_ID}/`);

  let timerInterval = null;
  let timerTotal = 15;

  function show(...ids) { ids.forEach(id => { document.getElementById(id).style.display = 'flex'; }); }
  function hide(...ids) { ids.forEach(id => { document.getElementById(id).style.display = 'none'; }); }
  function showBlock(...ids) { ids.forEach(id => { document.getElementById(id).style.display = 'block'; }); }

  function setJugador(nombre) {
    document.getElementById('jugador-actual').textContent = nombre;
    showBlock('jugador-actual-box');
  }

  function renderCadena(nombres) {
    const el = document.getElementById('cadena');
    el.innerHTML = nombres.map((n, i) => {
      const cls = i === nombres.length - 1 ? 'cadena-item activo' : 'cadena-item';
      return `<span class="${cls}">${n}</span>`;
    }).join('');
    showBlock('cadena-box');
  }

  function startTimer(segundos) {
    clearInterval(timerInterval);
    timerTotal = segundos;
    const bar = document.getElementById('timer-bar');
    const text = document.getElementById('timer-text');
    let remaining = segundos;

    bar.style.transition = 'none';
    bar.style.width = '100%';
    bar.style.background = 'var(--bien)';
    text.textContent = `${remaining}s`;
    showBlock('timer-box');

    timerInterval = setInterval(() => {
      remaining--;
      const pct = (remaining / timerTotal) * 100;
      bar.style.transition = 'width 1s linear, background 0.5s';
      bar.style.width = pct + '%';
      if (pct < 30) bar.style.background = 'var(--mal)';
      else if (pct < 60) bar.style.background = 'var(--medio)';
      text.textContent = `${remaining}s`;
      if (remaining <= 0) clearInterval(timerInterval);
    }, 1000);
  }

  function setTurno(miTurno) {
    const label = document.getElementById('turno-label');
    const input = document.getElementById('nombre-input');
    const btn = document.getElementById('enviar-btn');
    if (miTurno) {
      label.textContent = '¡Tu turno!';
      label.className = 'turno-yo';
      input.disabled = false;
      btn.disabled = false;
      input.focus();
    } else {
      label.textContent = 'Turno del rival...';
      label.className = 'turno-rival';
      input.disabled = true;
      btn.disabled = true;
    }
  }

  function mostrarFin(gane, razon, cadena, opciones) {
    clearInterval(timerInterval);
    hide('input-box', 'timer-box');
    if (cadena && cadena.length) renderCadena(cadena);

    const titulo = document.getElementById('fin-titulo');
    const razEl = document.getElementById('fin-razon');

    if (gane === null) {
      titulo.textContent = 'Partida cancelada';
      titulo.style.color = 'var(--hai)';
    } else if (gane) {
      titulo.textContent = '¡Has ganado!';
      titulo.style.color = 'var(--oro)';
    } else {
      titulo.textContent = 'Has perdido';
      titulo.style.color = 'var(--shu-claro)';
    }

    razEl.textContent = razon === 'tiempo' ? 'El tiempo se agotó' : razon;

    if (gane === false && razon === 'tiempo' && opciones && opciones.length) {
      const listaEl = document.getElementById('opciones-lista');
      listaEl.innerHTML = opciones.map(n => `<span class="opcion">${n}</span>`).join('');
      document.getElementById('opciones-box').style.display = 'flex';
    }

    showBlock('fin-box');
  }

  ws.onopen = () => {
    document.getElementById('status-box').textContent = 'Conectado. Esperando rival...';
  };
  ws.onclose = () => {
    clearInterval(timerInterval);
    document.getElementById('status-box').textContent = 'Conexión cerrada.';
    showBlock('status-box');
  };
  ws.onerror = () => {
    document.getElementById('status-box').textContent = 'Error de conexión.';
  };

  ws.onmessage = function(e) {
    const data = JSON.parse(e.data);

    if (data.type === 'esperando') {
      document.getElementById('status-box').textContent = data.msg;
      document.getElementById('share-box').style.display = 'block';
    }
    if (data.type === 'start') {
      hide('status-box');
      document.getElementById('share-box').style.display = 'none';
      setJugador(data.jugador_inicial);
      renderCadena([data.jugador_inicial]);
      show('input-box');
      setTurno(data.mi_turno);
      startTimer(data.tiempo);
    }
    if (data.type === 'valido') {
      document.getElementById('error-msg').textContent = '';
      document.getElementById('nombre-input').value = '';
      setJugador(data.nombre);
      renderCadena(data.cadena);
      setTurno(data.mi_turno);
      startTimer(data.tiempo);
    }
    if (data.type === 'invalido') {
      document.getElementById('error-msg').textContent = data.msg;
    }
    if (data.type === 'fin') {
      mostrarFin(data.gane, data.razon, data.cadena, data.opciones);
    }
    if (data.type === 'error') {
      document.getElementById('status-box').textContent = data.msg;
    }
    if (data.type === 'rematch') {
      window.location.href = `/kblix/sala/${data.room_id}/`;
    }
  };

  function pedirRevancha() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let newRoom = '';
    for (let i = 0; i < 6; i++) newRoom += chars[Math.floor(Math.random() * chars.length)];
    document.getElementById('rematch-btn').disabled = true;
    document.getElementById('rematch-btn').textContent = 'Esperando al rival...';
    ws.send(JSON.stringify({ type: 'rematch', room_id: newRoom }));
  }

  function enviar() {
    const input = document.getElementById('nombre-input');
    const nombre = input.value.trim();
    if (!nombre) return;
    document.getElementById('error-msg').textContent = '';
    ws.send(JSON.stringify({ nombre }));
  }

  document.getElementById('enviar-btn').addEventListener('click', enviar);
  document.getElementById('nombre-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') enviar();
  });

  document.getElementById('share-link').addEventListener('click', function() {
    navigator.clipboard.writeText(this.textContent).then(() => {
      this.textContent = '¡Copiado!';
      setTimeout(() => this.textContent = ROOM_ID, 1500);
    });
  });
</script>
{% endblock %}
